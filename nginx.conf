server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 50M;

    # Docker ichki DNS. proxy_pass'da o'zgaruvchi ishlatilganda nginx
    # upstream manzilni har so'rovda qayta rezolyutsiya qiladi.
    # Bu backend konteyner qayta yaratilib IP o'zgarganda 502 bo'lishining oldini oladi.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Xavfsizlik sarlavhalari (barcha javoblar uchun)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    # Gzip siqish (Tez yuklanish uchun)
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    # Next.js statik resurslar — uzoq muddatli keshlash
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
        access_log off;
    }

    # Django API proksi (Docker tarmog'i ichidagi backend konteyneri)
    # $request_uri orqali to'liq yo'l saqlanadi; DNS yuqoridagi resolver orqali yangilanadi
    location /api/ {
        proxy_pass http://backend:8000$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django Admin paneli
    location /admin/ {
        proxy_pass http://backend:8000$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django statik fayllari (Admin css/js)
    location /static/ {
        proxy_pass http://backend:8000$request_uri;
        proxy_set_header Host $host;
    }
}
