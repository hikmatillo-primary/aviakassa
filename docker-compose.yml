services:
  db:
    image: postgres:16-alpine
    container_name: aviakassa_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-aviakassa_db}
      POSTGRES_USER: ${DB_USER:-aviakassa_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Faqat localhostga ochiq (internetdan yopiq). Serverdagi 5432 bilan to'qnashmasin.
      - "127.0.0.1:5433:5432"
    networks:
      - aviakassa_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-aviakassa_user} -d ${DB_NAME:-aviakassa_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aviakassa_backend
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn core.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    volumes:
      - ./backend:/app
    ports:
      # Faqat localhostga ochiq. Tashqi kirish frontend nginx /api proksisi orqali bo'ladi.
      - "127.0.0.1:8000:8000"
    environment:
      - DEBUG=${DEBUG:-False}
      - SECRET_KEY=${SECRET_KEY}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS}
      - DB_ENGINE=django.db.backends.postgresql
      - DB_NAME=${DB_NAME:-aviakassa_db}
      - DB_USER=${DB_USER:-aviakassa_user}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=db
      - DB_PORT=5432
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/api/health/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - aviakassa_net

  bot:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aviakassa_bot
    restart: unless-stopped
    command: python manage.py run_telegram_bot
    volumes:
      - ./backend:/app
    environment:
      - DEBUG=${DEBUG:-False}
      - SECRET_KEY=${SECRET_KEY}
      - DB_ENGINE=django.db.backends.postgresql
      - DB_NAME=${DB_NAME:-aviakassa_db}
      - DB_USER=${DB_USER:-aviakassa_user}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=db
      - DB_PORT=5432
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_EXPIRING_DAYS=${TELEGRAM_EXPIRING_DAYS:-5}
      - TELEGRAM_ALLOWED_CHAT_IDS=${TELEGRAM_ALLOWED_CHAT_IDS:-}
    depends_on:
      db:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - aviakassa_net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aviakassa_frontend
    restart: unless-stopped
    ports:
      - "3002:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - aviakassa_net

volumes:
  postgres_data:
    driver: local

networks:
  aviakassa_net:
    driver: bridge
